name: tiny_trainer
description: "TinyTrainer — train a tiny Transformer on your phone or PC. Flutter cross-platform version."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  # The C training engine (dart:ffi, native assets).
  tinytrainer_engine:
    path: packages/tinytrainer_engine
  # Pick corpus .txt / .brain files on every platform.
  file_picker: ^10.3.0
  # App documents directory (corpus + brain storage).
  path_provider: ^2.1.5
  # Persist the active-corpus list and last-used settings.
  shared_preferences: ^2.5.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled base brain. The first release ships a placeholder text file
    # (not a real .brain); the app detects that and tells the user.
    # The real pre-trained base.brain replaces this file later.
    - assets/base.brain
