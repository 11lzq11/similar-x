name: tinytrainer_engine
description: "Dart FFI bindings for the TinyTrainer C training engine (tiny Transformer trainer)."
version: 0.1.0

environment:
  sdk: ^3.14.0

dependencies:
  # Build hook dependencies (hook/build.dart compiles src/tinygpt.c).
  code_assets: ^2.0.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.4
  # Utf8 helpers (toNativeUtf8 / toDartString) used by the FFI wrapper.
  ffi: ^2.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
