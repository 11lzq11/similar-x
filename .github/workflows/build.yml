name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Android APK
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTrainer-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Windows
    needs: [analyze, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTrainer-Windows
          path: build/windows/x64/runner/Release/

  build-ios:
    name: iOS IPA (unsigned)
    needs: [analyze, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build ipa --no-codesign
      # `flutter build ipa --no-codesign` only produces an .xcarchive, so
      # hand-package Runner.app into an unsigned .ipa (same trick as the
      # old Similar-X repo used).
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/ios/archive -name "Runner.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r TinyTrainer-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTrainer-iOS
          path: TinyTrainer-iOS-unsigned.ipa

  build-macos:
    name: macOS DMG (unsigned)
    needs: [analyze, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          hdiutil create -volname TinyTrainer -srcfolder build/macos/Build/Products/Release/tiny_trainer.app -ov -format UDZO TinyTrainer-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTrainer-macOS
          path: TinyTrainer-macOS.dmg

  build-linux:
    name: Linux
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux tarball
        run: |
          tar -czf TinyTrainer-Linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTrainer-Linux
          path: TinyTrainer-Linux.tar.gz
