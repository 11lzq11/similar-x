name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Android APK
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: python3 scripts/fetch_tdlib.py --platform android
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Similar-X-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Windows
    needs: [analyze, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: python3 scripts/fetch_tdlib.py --platform windows
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Similar-X-Windows
          path: build/windows/x64/runner/Release/

  build-ios:
    name: iOS IPA (unsigned)
    needs: [analyze, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: python3 scripts/fetch_tdlib.py --platform ios
      - run: flutter build ipa --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: Similar-X-iOS-unsigned
          path: build/ios/ipa/*.ipa

  build-macos:
    name: macOS DMG (unsigned)
    needs: [analyze, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get
      - run: python3 scripts/fetch_tdlib.py --platform macos
      - run: flutter build macos --release
      - run: |
          hdiutil create -volname "Similar-X" \
            -srcfolder "build/macos/Build/Products/Release/Similar-X.app" \
            -ov -format UDZO "Similar-X-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Similar-X-macOS
          path: Similar-X-macOS.dmg

  build-linux:
    name: Linux
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - run: python3 scripts/fetch_tdlib.py --platform linux
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: Similar-X-Linux
          path: build/linux/x64/release/bundle/

  release:
    name: Release
    needs: [build-android, build-windows, build-ios, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts/Similar-X-Windows && zip -r ../Similar-X-Windows.zip . && cd ../..
          cd artifacts/Similar-X-Linux && tar czf ../Similar-X-Linux.tar.gz . && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Similar-X-Android/*
            artifacts/Similar-X-iOS-unsigned/*
            artifacts/Similar-X-macOS/*
            artifacts/Similar-X-Windows.zip
            artifacts/Similar-X-Linux.tar.gz
          generate_release_notes: true
